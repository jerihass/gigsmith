<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#080a0b" />
    <script>
      try {
        const storedTheme = localStorage.getItem("gigsmith.theme.v1");
        const theme = storedTheme === "light" || storedTheme === "neon" ? storedTheme : "dark";
        document.documentElement.dataset.theme = theme;
        document.querySelector('meta[name="theme-color"]').content = theme === "light" ? "#edf3f2" : theme === "neon" ? "#050008" : "#080a0b";
      } catch {
        document.documentElement.dataset.theme = "dark";
      }
    </script>
    <link rel="manifest" href="%BASE_URL%manifest.webmanifest" />
    <link rel="apple-touch-icon" href="%BASE_URL%icons/gigsmith-192.png" />
    <meta
      name="description"
      content="Gigsmith is an unofficial local-first Cyberpunk TCG deckbuilding and rules utility."
    />
    <title>Gigsmith</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
