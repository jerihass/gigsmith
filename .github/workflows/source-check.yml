name: Source Check

on:
  schedule:
    - cron: "18 13 * * 1"
  workflow_dispatch:

permissions:
  contents: read
  issues: write

concurrency:
  group: source-check
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Check card and rules sources
        run: node scripts/check-source-changes.mjs --json source-check.json --markdown source-check.md

      - name: Add workflow summary
        run: cat source-check.md >> "$GITHUB_STEP_SUMMARY"

      - name: Open or update tracking issue
        uses: actions/github-script@v8
        with:
          script: |
            const fs = require("fs");
            const report = JSON.parse(fs.readFileSync("source-check.json", "utf8"));
            if (!report.changed) {
              core.info("No source changes detected.");
              return;
            }

            const title = "Gigsmith source changes detected";
            const body = fs.readFileSync("source-check.md", "utf8");
            const { owner, repo } = context.repo;
            try {
              await github.rest.issues.createLabel({
                owner,
                repo,
                name: "source-check",
                color: "0e7490",
                description: "Automated card/rules source monitoring"
              });
            } catch (error) {
              if (error.status !== 422) throw error;
            }
            const existing = await github.paginate(github.rest.issues.listForRepo, {
              owner,
              repo,
              state: "open",
              labels: "source-check"
            });
            const issue = existing.find((candidate) => candidate.title === title);
            if (issue) {
              await github.rest.issues.update({ owner, repo, issue_number: issue.number, body });
              await github.rest.issues.createComment({
                owner,
                repo,
                issue_number: issue.number,
                body: `Source changes are still present as of ${report.checkedAt}. The issue body was refreshed with the latest report.`
              });
              return;
            }

            await github.rest.issues.create({
              owner,
              repo,
              title,
              body,
              labels: ["source-check"]
            });
